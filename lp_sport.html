                        <td className="text-right px-3 py-2" style={{ color: C.text, fontFamily: "'JetBrains Mono', monospace" }}>{r.cantidad}</td>
                        <td className="px-3 py-2 text-[11px]" style={{ color: C.textDim, fontFamily: "'D-DIN Expanded', 'Barlow', sans-serif" }}>{r.adicionales || "—"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )
          }
        </div>
      )}

      <div className="flex justify-end gap-2 mt-4">
        <Btn variant="ghost" onClick={() => setText("")} disabled={!text}>Limpiar</Btn>
        <Btn variant="primary" icon={CheckCircle2} onClick={() => { onApply(parsed); setText(""); }} disabled={parsed.length === 0}>
          {parsed.length > 0 ? `Agregar ${parsed.length} ${parsed.length === 1 ? "fila" : "filas"}` : "Agregar filas"}
        </Btn>
      </div>
    </div>
  );
};

const PlanillaEditor = ({ order, empresa, onBack, onUpdate }) => {
  const roster = order.roster || [];
  const attachedFiles = order.archivosPlanilla || [];
  const [showPaste, setShowPaste] = useState(roster.length === 0 && attachedFiles.length === 0);
  const [lightbox, setLightbox] = useState(null);
  const totalCamisetas = roster.reduce((a, b) => a + (Number(b.camiseta) || 0), 0);
  const totalShorts    = roster.reduce((a, b) => a + (Number(b.short)    || 0), 0);

  const updateRoster = (newRoster) => onUpdate({ ...order, roster: newRoster });
  const addFile = (file) => onUpdate({ ...order, archivosPlanilla: [...attachedFiles, file] });
  const removeFile = (idx) => onUpdate({ ...order, archivosPlanilla: attachedFiles.filter((_, i) => i !== idx) });

  const summaryParts = [`${roster.length} ${roster.length === 1 ? "fila" : "filas"}`];
  if (totalCamisetas > 0) summaryParts.push(`${totalCamisetas} ${totalCamisetas === 1 ? "camiseta" : "camisetas"}`);
  if (totalShorts > 0) summaryParts.push(`${totalShorts} ${totalShorts === 1 ? "short" : "shorts"}`);

  return (
    <div className="px-4 md:px-8 py-4 md:py-6">
      <button onClick={onBack} className="flex items-center gap-1.5 text-[11.5px] mb-4 transition-colors" style={{ color: C.textDim }}
        onMouseEnter={e => e.currentTarget.style.color = C.text} onMouseLeave={e => e.currentTarget.style.color = C.textDim}>
        <ArrowLeft size={13} /> Volver a Planillas
      </button>

      <div className="flex items-start justify-between gap-4 mb-5 flex-wrap">
        <div className="min-w-0 flex items-center gap-3">
          <div className="w-11 h-11 rounded-xl flex items-center justify-center text-[13px] font-black shrink-0" style={{
            background: "linear-gradient(135deg, " + (empresa?.color || C.accent) + "33, " + (empresa?.color || C.accent) + "11)",
            color: empresa?.color || C.accent,
            boxShadow: "inset 0 1px 0 0 " + (empresa?.color || C.accent) + "44, 0 0 0 1px " + (empresa?.color || C.accent) + "33",
            fontFamily: "'D-DIN Expanded', 'Barlow Condensed', sans-serif"
          }}>{getInitials(order.cliente)}</div>
          <div>
            <div className="text-[22px] font-bold" style={{ color: C.text, fontFamily: "'D-DIN Expanded', 'Barlow', sans-serif", letterSpacing: "-0.01em" }}>{order.cliente}</div>
            <div className="text-[11px]" style={{ color: C.textDim, fontFamily: "'JetBrains Mono', monospace", ...PREMIUM_FONT }}>
              {order.id} · entrega {order.fechaEntrega}
              {roster.length > 0 && ` · ${summaryParts.join(" · ")}`}
            </div>
          </div>
        </div>
        <div className="flex gap-2">
          {!showPaste && <Btn variant="ghost" icon={ClipboardPaste} onClick={() => setShowPaste(true)}>Importar lista</Btn>}
          <Btn variant="primary" icon={Download} onClick={() => downloadPlanillaPNG(order, empresa)} disabled={roster.length === 0}>Descargar imagen</Btn>
        </div>
      </div>

      {/* Attached files chip list */}
      {attachedFiles.length > 0 && (
        <div className="mb-4">
          <SectionLabel>Adjuntos de la planilla · {attachedFiles.length}</SectionLabel>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 mt-2">
            {attachedFiles.map((a, i) => {
              const isImg = a.type?.startsWith("image/") && a.dataUrl;
              return (
                <div key={i} className="flex items-center gap-3 p-2.5 rounded-xl group" style={{ background: C.surface2, boxShadow: ELEV.card }}>
                  {isImg ? (
                    <button onClick={() => setLightbox(a)} className="w-12 h-12 rounded-lg overflow-hidden shrink-0" style={{ cursor: "zoom-in", boxShadow: ELEV.highlight }}>
                      <img src={a.dataUrl} alt="" className="w-full h-full object-cover" />
                    </button>
                  ) : (
                    <div className="w-12 h-12 rounded-lg flex items-center justify-center shrink-0" style={{ background: C.surface3, color: C.accent }}><FileText size={18} /></div>
                  )}
                  <div className="flex-1 min-w-0">
                    <div className="text-[12.5px] font-semibold truncate" style={{ color: C.text }}>{a.name}</div>
                    <div className="text-[10.5px]" style={{ color: C.textMute, fontFamily: "'JetBrains Mono', monospace" }}>{fmtBytes(a.size)}</div>
                  </div>
                  <div className="flex gap-1 opacity-60 group-hover:opacity-100 transition-opacity">
                    {a.dataUrl && <a href={a.dataUrl} download={a.name} className="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-white/5" title="Descargar"><Download size={12} style={{ color: C.textDim }} /></a>}
                    <button onClick={() => removeFile(i)} className="w-7 h-7 rounded-lg flex items-center justify-center hover:bg-red-500/10" title="Quitar"><X size={12} style={{ color: C.textDim }} /></button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showPaste && <PlanillaPastePanel
        onApply={rows => { updateRoster([...roster, ...rows]); setShowPaste(false); toast.ok(`${rows.length} ${rows.length === 1 ? "fila importada" : "filas importadas"}`); }}
        onAddFile={(f) => { addFile(f); toast.ok(`Archivo "${f.name}" adjuntado`); }}
        onCollapse={() => setShowPaste(false)}
        canCollapse={roster.length > 0 || attachedFiles.length > 0}
      />}

      {roster.length === 0 && !showPaste ? (
        <Card className="p-14 text-center">
          <ClipboardList size={28} className="mx-auto mb-3" style={{ color: C.textMute }} />
          <div className="text-[15px] font-bold mb-1" style={{ color: C.text, fontFamily: "'D-DIN Expanded', 'Barlow', sans-serif" }}>Planilla vacía</div>
          <div className="text-[12.5px] mb-4" style={{ color: C.textDim }}>Pegá el mensaje del cliente, subí un archivo, o agregá filas a mano.</div>
          <Btn variant="primary" icon={ClipboardPaste} onClick={() => setShowPaste(true)}>Importar lista</Btn>
        </Card>
      ) : (
        <Card className="p-5">
          <RosterGrid roster={roster} onChange={updateRoster} />
        </Card>
      )}

      {lightbox && <Lightbox archivo={lightbox} onClose={() => setLightbox(null)} />}
    </div>
  );
};

const PlanillasList = ({ orders, empresas, onSelect, searchQuery = "" }) => {
  const q = searchQuery.trim().toLowerCase();
  const planillas = orders
    .filter(o => o.roster?.length > 0)
    .filter(o => !q || (o.id && o.id.toLowerCase().includes(q)) || (o.cliente && o.cliente.toLowerCase().includes(q)));
  if (!planillas.length) return (
    <div className="px-4 md:px-8 py-4 md:py-6">
      <Card className="p-14 text-center">
        <ClipboardList size={32} className="mx-auto mb-4" style={{ color: C.textMute }} />
        <div className="text-[15px] font-bold mb-1.5" style={{ color: C.text }}>{q ? `Sin planillas para "${searchQuery}"` : "Todavía no hay planillas armadas"}</div>
        <div className="text-[12px] max-w-md mx-auto" style={{ color: C.textDim, lineHeight: 1.6 }}>
          {q ? "Probá otro término o vaciá la búsqueda." : "Para crear una planilla, entrá a cualquier pedido desde Pedidos y tocá \"Crear planilla\". El mensaje del cliente se pega ahí mismo y la planilla se arma automáticamente."}
        </div>
      </Card>
    </div>
  );
  return (
    <div className="px-4 md:px-8 py-4 md:py-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      {planillas.map(o => {
        const empresa = empresas.find(e => e.nombre === o.cliente);
        const totalCamisetas = o.roster.reduce((a, b) => a + (Number(b.camiseta) || 0), 0);
        const totalShorts    = o.roster.reduce((a, b) => a + (Number(b.short) || 0), 0);
        const ec = empresa?.color || C.accent;
        return (
          <Tilt3D key={o.id} intensity={4} onClick={() => onSelect(o.id)} className="cursor-pointer">
            <div className="rounded-2xl p-5 text-left"
              style={{
                background: "linear-gradient(180deg, " + C.surface + " 0%, " + C.bgSoft + " 100%)",
                boxShadow: ELEV.card,
                transition: "box-shadow 240ms cubic-bezier(.2,.8,.2,1)"
              }}
              onMouseEnter={e => e.currentTarget.style.boxShadow = ELEV.cardHover.replace("rgba(94,169,232,0.08)", ec + "20")}
              onMouseLeave={e => e.currentTarget.style.boxShadow = ELEV.card}
            >
              <div className="flex items-start gap-3 mb-3">
                <div className="w-11 h-11 rounded-xl flex items-center justify-center text-[13px] font-black shrink-0" style={{
                  background: "linear-gradient(135deg, " + ec + "33 0%, " + ec + "11 100%)",
                  color: ec,
                  boxShadow: "inset 0 1px 0 0 " + ec + "44, 0 0 0 1px " + ec + "33",
                  fontFamily: "'D-DIN Expanded', 'Barlow Condensed', sans-serif"
                }}>{getInitials(o.cliente)}</div>

                  <div className="text-[10px]" style={{ color: C.textMute, fontFamily: "'JetBrains Mono', monospace", ...PREMIUM_FONT }}>{o.id}</div>
                </div>
              </div>
              {o.productos?.length > 0 && <div className="text-[11px] mb-3 truncate" style={{ color: C.textDim }}>{o.productos.map(p => p.tipo).join(" · ")}</div>}
              <div className="flex items-end justify-between pt-3" style={{ borderTop: `1px solid ${C.border}` }}>
                <div>
                  <div className="text-[24px] font-black leading-none" style={{ color: ec, fontFamily: "'D-DIN Expanded', 'Barlow Condensed', sans-serif", ...PREMIUM_FONT }}>{o.roster.length}</div>
                  <div className="text-[9px] uppercase tracking-[0.2em] mt-1 font-bold" style={{ color: C.textMute }}>filas</div>
                </div>
                <div className="text-right">
                  {totalCamisetas > 0 && <div className="text-[12.5px] font-bold" style={{ color: C.text, fontFamily: "'JetBrains Mono', monospace", ...PREMIUM_FONT }}>{totalCamisetas} {totalCamisetas === 1 ? "camiseta" : "camisetas"}</div>}
                  {totalShorts > 0 && <div className="text-[10.5px] mt-0.5" style={{ color: C.textDim, fontFamily: "'JetBrains Mono', monospace", ...PREMIUM_FONT }}>{totalShorts} {totalShorts === 1 ? "short" : "shorts"}</div>}
                </div>
              </div>
            </div>
          </Tilt3D>
        );
      })}
    </div>
  );
};

const Planillas = ({ orders, setOrders, empresas, pendingPlanillaOrderId, clearPendingPlanillaOrderId, searchQuery = "" }) => {
  const [selectedOrderId, setSelectedOrderId] = useState(null);
  useEffect(() => { if (pendingPlanillaOrderId) { setSelectedOrderId(pendingPlanillaOrderId); clearPendingPlanillaOrderId?.(); } }, [pendingPlanillaOrderId]);
  useEffect(() => { if (selectedOrderId && !orders.find(o => o.id === selectedOrderId)) setSelectedOrderId(null); }, [selectedOrderId, orders]);

  const selectedOrder = selectedOrderId ? orders.find(o => o.id === selectedOrderId) : null;
  if (selectedOrder) {
    const empresa = empresas.find(e => e.nombre === selectedOrder.cliente);
    return <PlanillaEditor order={selectedOrder} empresa={empresa} onBack={() => setSelectedOrderId(null)} onUpdate={updated => setOrders(orders.map(o => o.id === updated.id ? updated : o))} />;
  }
  return <PlanillasList orders={orders} empresas={empresas} onSelect={setSelectedOrderId} searchQuery={searchQuery} />;
};

// ── v10: Dashboard (Inicio) ─────────────────────────────────────
// Single panoramic view designed to answer "qué tengo que hacer hoy".
// KPIs + próximas entregas + atrasados + actividad reciente. Cero scrolls horizontales,
// todo encima del fold a 1280px.
const Dashboard = ({ orders, designs, customers, onOpenOrder, onOpenDesign, onSetPage }) => {
  const [refreshKey, setRefreshKey] = useState(0);
  const activity = useActivityLog(15, refreshKey);
  // Refresh activity every 30s so a second device's actions show up
  useEffect(() => { const t = setInterval(() => setRefreshKey(k => k + 1), 30000); return () => clearInterval(t); }, []);

  const visibleOrders = useMemo(() => orders.filter(o => o.estado !== "archivado"), [orders]);
  const activos = visibleOrders.filter(o => o.estado !== "entrega");
  const atrasados = activos.filter(o => daysDiff(o.fechaEntrega) < 0);
  const proximos = activos.filter(o => { const d = daysDiff(o.fechaEntrega); return d >= 0 && d <= 7; }).sort((a, b) => daysDiff(a.fechaEntrega) - daysDiff(b.fechaEntrega));
  const ahora = new Date();
  const thisMonth = orders.filter(o => { const d = new Date(o.fechaPedido); return d.getMonth() === ahora.getMonth() && d.getFullYear() === ahora.getFullYear(); });
  const last30dEntregas = orders.filter(o => o.estado === "entrega" && daysDiff(o.fechaEntrega) >= -30 && daysDiff(o.fechaEntrega) <= 0);

  const kpis = [
    { label: "Activos",       value: activos.length,         icon: Package,    color: C.accent, sub: `de ${visibleOrders.length} pedidos`,           onClick: () => onSetPage("pedidos") },
    { label: "Atrasados",     value: atrasados.length,       icon: AlertTriangle, color: C.danger, sub: atrasados.length === 0 ? "todo al día" : "necesitan acción ya", onClick: () => onSetPage("entregas") },
    { label: "Este mes",      value: thisMonth.length,       icon: TrendingUp, color: "#a855f7", sub: "pedidos nuevos",                                  onClick: () => onSetPage("pedidos") },
    { label: "Entregados 30d", value: last30dEntregas.length, icon: CheckCircle2, color: C.ok,    sub: "últimos 30 días",                                 onClick: () => onSetPage("entregas") },
  ];

  return (
    <div className="space-y-5">
      {/* Header */}
      <div className="flex items-center justify-between">
        <div>
          <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-[11px] font-bold uppercase tracking-wider" style={{ background: C.accentSoft, color: C.accent, border: `1px solid ${C.accent}33`, fontFamily: "'D-DIN Expanded','Barlow',sans-serif" }}>
            <Sparkles size={12} strokeWidth={2.5} />
            INICIO · v11
          </div>
          <div className="text-[11px] mt-2" style={{ color: C.textDim }}>Resumen de tu día — actualizado en vivo</div>
        </div>
        <ConnectionBadge />
      </div>

      {/* KPI cards */}
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
        {kpis.map((k, i) => {
          const Icon = k.icon;
          return (
            <button key={i} onClick={k.onClick}
              className="text-left p-4 rounded-2xl transition-all hover:-translate-y-0.5"
              style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: ELEV.highlight }}
              onMouseEnter={e => e.currentTarget.style.borderColor = k.color + "55"}
              onMouseLeave={e => e.currentTarget.style.borderColor = C.border}
            >
              <div className="flex items-center justify-between mb-2.5">
                <div className="w-9 h-9 rounded-lg flex items-center justify-center" style={{ background: k.color + "22", color: k.color }}><Icon size={16} strokeWidth={2.2} /></div>
                <ChevronRight size={14} style={{ color: C.textMute }} />
              </div>
              <div className="text-[28px] font-black leading-none" style={{ color: k.color, fontFamily: "'D-DIN Expanded','Barlow',sans-serif" }}>{k.value}</div>
              <div className="text-[11px] font-bold mt-1.5 uppercase tracking-wider" style={{ color: C.text }}>{k.label}</div>
              <div className="text-[10px] mt-0.5" style={{ color: C.textMute }}>{k.sub}</div>
            </button>
          );
        })}
      </div>

      {/* Two columns: Próximas entregas + Atrasados */}
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-3">
        <DashSection title="Próximas entregas" icon={Clock} count={proximos.length} accent={C.accent}>
          {proximos.length === 0
            ? <Empty>Nada para los próximos 7 días</Empty>
            : proximos.slice(0, 5).map(o => (
              <DashRow key={o.id} order={o} onClick={() => onOpenOrder(o)} />
            ))
          }
        </DashSection>

        <DashSection title="Atrasados" icon={AlertTriangle} count={atrasados.length} accent={atrasados.length ? C.danger : C.ok}>
          {atrasados.length === 0
            ? <Empty>Sin pedidos vencidos</Empty>
            : atrasados.slice(0, 5).map(o => (
              <DashRow key={o.id} order={o} onClick={() => onOpenOrder(o)} highlight />
            ))
          }
        </DashSection>
      </div>

      {/* Activity feed (only when connected to server) */}
      <DashSection title="Actividad reciente" icon={Activity} count={activity.length} accent={C.textDim}>
        {activity.length === 0
          ? <Empty>Los movimientos van a aparecer acá cuando estés sincronizado al servidor</Empty>
          : (
            <div className="space-y-1.5">
              {activity.slice(0, 10).map(e => (
                <button key={e.id}
                  onClick={() => {
                    if (!e.orderId) return;
                    const o = orders.find(x => x.id === e.orderId);
                    if (o) onOpenOrder(o);
                  }}
                  disabled={!e.orderId}
                  className="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-left transition-colors hover:bg-white/5"
                  style={{ cursor: e.orderId ? "pointer" : "default" }}
                >
                  <span className="text-[10px] font-bold uppercase shrink-0 px-1.5 py-0.5 rounded" style={{ background: "rgba(255,255,255,0.04)", color: C.textDim, fontFamily: "'JetBrains Mono',monospace" }}>{e.type.split(".")[0]}</span>
                  <span className="text-[12px] truncate flex-1" style={{ color: C.text }}>{e.message}</span>
                  <span className="text-[10px] shrink-0" style={{ color: C.textMute }}>{fmtRelative(e.timestamp)}</span>
                </button>
              ))}
            </div>
          )
        }
      </DashSection>
    </div>
  );
};

const DashSection = ({ title, icon: Icon, count, accent, children }) => (

const DashRow = ({ order, onClick, highlight }) => {
  const d = daysDiff(order.fechaEntrega);
  const dateLabel = d === 0 ? "hoy" : d < 0 ? `${Math.abs(d)} días atraso` : d === 1 ? "mañana" : `en ${d} días`;
  const dateColor = d < 0 ? C.danger : d <= 2 ? C.warn : C.textDim;
  const cfg = estadoConfig[order.estado] || estadoConfig.diseno;
  const unidades = (order.roster || []).reduce((s, r) => s + (r.camiseta || 0) + (r.short || 0), 0);
  return (
    <button onClick={onClick}
      className="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition-colors hover:bg-white/5"
      style={{ border: highlight ? `1px solid ${C.danger}33` : "1px solid transparent" }}

      <span className="text-[10px] font-black px-1.5 py-0.5 rounded shrink-0" style={{ background: cfg.bg, color: cfg.color, fontFamily: "'JetBrains Mono',monospace" }}>{order.id.split("-").pop()}</span>
      <div className="flex-1 min-w-0">
        <div className="text-[12.5px] font-semibold truncate" style={{ color: C.text }}>{order.cliente}</div>
        <div className="text-[10px] truncate" style={{ color: C.textMute }}>{cfg.label} · {unidades || "sin"} unidades</div>
      </div>
      <div className="text-right shrink-0">
        <div className="text-[10.5px] font-bold" style={{ color: dateColor, fontFamily: "'D-DIN Expanded','Barlow',sans-serif" }}>{dateLabel}</div>
        <div className="text-[9px]" style={{ color: C.textMute, fontFamily: "'JetBrains Mono',monospace" }}>{order.fechaEntrega}</div>
      </div>
      <ChevronRight size={14} style={{ color: C.textMute }} />
    </button>
  );
};

const Empty = ({ children }) => (

// ── v10: CommandPalette (Cmd/Ctrl+K) ────────────────────────────
// Global fuzzy search over orders, designs, customers, empresas. Opens with Cmd+K
// or Ctrl+K, closes with Esc. ↑↓ to navigate, Enter to jump.
const CommandPalette = ({ open, onClose, orders, designs, customers, empresas, onOpenOrder, onOpenDesign, onSetPage }) => {
  const [q, setQ] = useState("");
  const [activeIdx, setActiveIdx] = useState(0);
  const inputRef = useRef(null);

  useEffect(() => {
    if (!open) { setQ(""); setActiveIdx(0); return; }
    // Autofocus on open
    setTimeout(() => inputRef.current?.focus(), 50);
  }, [open]);

  // Build candidates fresh each render based on `q`
  const results = useMemo(() => {
    if (!open) return [];
    const norm = q.trim().toLowerCase();
    const all = [];
    // Static pages first
    if (!norm) {
      return [
        { kind: "page", id: "inicio",    label: "Inicio",     hint: "Ir a Inicio",      icon: Home,          action: () => onSetPage("inicio") },
        { kind: "page", id: "pedidos",   label: "Pedidos",    hint: "Ir a Pedidos",     icon: Package,       action: () => onSetPage("pedidos") },
        { kind: "page", id: "planillas", label: "Planillas",  hint: "Ir a Planillas",   icon: ClipboardList, action: () => onSetPage("planillas") },
        { kind: "page", id: "diseno",    label: "LP design",  hint: "Ir a la biblioteca",   icon: Palette,    action: () => onSetPage("diseno") },
        { kind: "page", id: "entregas",  label: "Entregas",   hint: "Ir a Entregas",    icon: Truck,         action: () => onSetPage("entregas") },
      ];
    }
    // Match orders by id, cliente, observaciones
    for (const o of orders) {
      if (o.id.toLowerCase().includes(norm) || o.cliente.toLowerCase().includes(norm) || (o.observaciones || "").toLowerCase().includes(norm)) {
        all.push({ kind: "order", id: o.id, label: o.id + " · " + o.cliente, hint: estadoConfig[o.estado]?.label || o.estado, icon: Package, action: () => onOpenOrder(o) });
      }
    }
    // Match designs
    for (const d of designs) {
      if (d.id.toLowerCase().includes(norm) || (d.nombre || "").toLowerCase().includes(norm) || (d.cliente || "").toLowerCase().includes(norm)) {
        all.push({ kind: "design", id: d.id, label: d.id + " · " + (d.nombre || d.cliente || ""), hint: "diseño", icon: Palette, action: () => onOpenDesign(d.id) });
      }
    }
    // Match customers / empresas
    for (const c of customers) {
      if ((c.equipo || "").toLowerCase().includes(norm) || (c.nombre || "").toLowerCase().includes(norm)) {
        all.push({ kind: "customer", id: c.id, label: c.equipo || c.nombre, hint: c.nombre || "cliente", icon: Users, action: () => onSetPage("pedidos") });
      }
    }
    for (const e of empresas) {
      if ((e.nombre || "").toLowerCase().includes(norm)) {
        all.push({ kind: "empresa", id: e.id, label: e.nombre, hint: "empresa", icon: Building2, action: () => onSetPage("planillas") });
      }
    }
    return all.slice(0, 50);
  }, [open, q, orders, designs, customers, empresas, onOpenOrder, onOpenDesign, onSetPage]);

  // Keep active index in range
  useEffect(() => { if (activeIdx >= results.length) setActiveIdx(0); }, [results.length, activeIdx]);

  const onKeyDown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActiveIdx(i => Math.min(i + 1, results.length - 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActiveIdx(i => Math.max(i - 1, 0)); }
    else if (e.key === "Enter") {
      e.preventDefault();
      const r = results[activeIdx];
      if (r) { r.action(); onClose(); }
    } else if (e.key === "Escape") { e.preventDefault(); onClose(); }
  };

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[80] flex items-start justify-center px-4 pt-[10vh]"
      style={{ background: "rgba(0,0,0,0.65)", backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)" }}
      onClick={onClose}
    >
      <div onClick={e => e.stopPropagation()} className="w-full max-w-xl rounded-2xl overflow-hidden"
        style={{ background: C.surface, border: `1px solid ${C.border}`, boxShadow: "0 24px 64px rgba(0,0,0,0.6)" }}
      >
        <div className="flex items-center gap-3 px-4 py-3.5" style={{ borderBottom: `1px solid ${C.border}` }}>
          <Search size={16} style={{ color: C.textMute }} />
          <input
            ref={inputRef}
            value={q}
            onChange={e => { setQ(e.target.value); setActiveIdx(0); }}
            onKeyDown={onKeyDown}
            placeholder="Buscar pedido, diseño, cliente o empresa…"
            className="flex-1 bg-transparent outline-none text-[13px]"
            style={{ color: C.text, fontFamily: "'D-DIN Expanded','Barlow',sans-serif" }}
          />
          <span className="text-[10px] px-1.5 py-0.5 rounded font-bold" style={{ background: "rgba(255,255,255,0.04)", color: C.textMute, fontFamily: "'JetBrains Mono',monospace" }}>ESC</span>
        </div>
        <div className="max-h-[60vh] overflow-y-auto py-1">
          {results.length === 0
            ? <div className="px-4 py-8 text-center text-[12px]" style={{ color: C.textMute }}>Sin resultados para "{q}"</div>
            : results.map((r, i) => {
              const Icon = r.icon;
              return (
                <button key={r.kind + "-" + r.id}
                  onClick={() => { r.action(); onClose(); }}
                  onMouseEnter={() => setActiveIdx(i)}
                  className="w-full flex items-center gap-3 px-4 py-2.5 text-left transition-colors"
                  style={{ background: i === activeIdx ? "rgba(94,169,232,0.12)" : "transparent" }}
                >
                  <Icon size={14} style={{ color: i === activeIdx ? C.accent : C.textMute }} />
                  <span className="text-[12.5px] flex-1 truncate" style={{ color: C.text, fontFamily: "'D-DIN Expanded','Barlow',sans-serif" }}>{r.label}</span>
                  <span className="text-[10px] shrink-0" style={{ color: C.textMute, fontFamily: "'JetBrains Mono',monospace" }}>{r.hint}</span>
                </button>
              );
            })
          }
        </div>
        <div className="flex items-center justify-between px-4 py-2.5 text-[10px]" style={{ borderTop: `1px solid ${C.border}`, color: C.textMute, fontFamily: "'JetBrains Mono',monospace" }}>
          <span>↑↓ navegar · ↵ abrir</span>
          <span>Cmd+K para abrir</span>
        </div>
      </div>
    </div>
  );
};


// ── Admin: user management panel ────────────────────────────────
const UsuariosAdmin = () => {
  const [users, setUsers] = useState([]);
  const [error, setError] = useState("");
  const [newUser, setNewUser] = useState({ username: "", password: "", role: "empleado" });
  const [creating, setCreating] = useState(false);

  const load = async () => {
    try {
      const r = await fetch("/api/admin/users", { credentials: "include" });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "No se pudo cargar usuarios");
      const d = await r.json();
      setUsers(d.users);
    } catch (e) { setError(e.message || "Error de red"); }
  };

  useEffect(() => { load(); }, []);

  const create = async () => {
    if (!newUser.username || !newUser.password) return;
    setCreating(true);
    try {
      const r = await fetch("/api/admin/users", {
        method: "POST", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(newUser)
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "No se pudo crear");
      setNewUser({ username: "", password: "", role: "empleado" });
      load();
    } catch (e) { setError(e.message); } finally { setCreating(false); }
  };

  const toggle = async (u) => {
    try {
      const r = await fetch(`/api/admin/users/${u.id}`, {
        method: "PATCH", credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: !u.active })
      });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "Error al actualizar");
      load();
    } catch (e) { setError(e.message); }
  };

  const del = async (u) => {
    if (!confirm(`¿Eliminar usuario "${u.username}"?`)) return;
    try {
      const r = await fetch(`/api/admin/users/${u.id}`, { method: "DELETE", credentials: "include" });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "No se pudo eliminar");
      load();
    } catch (e) { setError(e.message); }
  };

  const inputCls = "px-3 py-2 rounded-xl text-[13px] outline-none w-full";
  const inputSty = { background: C.surface2, color: C.text, border: `1px solid ${C.border}` };

  return (
    <div className="p-6 max-w-2xl mx-auto space-y-6">
      <div className="rounded-2xl p-5 space-y-3" style={{ background: C.surface, boxShadow: ELEV.card }}>
        <div className="text-[11px] font-black uppercase tracking-[0.16em] mb-3" style={{ color: C.textMute }}>Crear usuario</div>
        <div className="grid grid-cols-3 gap-3">
          <input className={inputCls} style={inputSty} placeholder="Usuario" value={newUser.username} onChange={e => setNewUser(p => ({ ...p, username: e.target.value }))} />
          <input className={inputCls} style={inputSty} placeholder="Contraseña" type="password" value={newUser.password} onChange={e => setNewUser(p => ({ ...p, password: e.target.value }))} />
          <select className={inputCls} style={inputSty} value={newUser.role} onChange={e => setNewUser(p => ({ ...p, role: e.target.value }))}>
            <option value="empleado">Empleado</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <Btn variant="primary" onClick={create} disabled={creating || !newUser.username || !newUser.password}>
          {creating ? "Creando…" : "Crear usuario"}
        </Btn>
        {error && <div className="text-[11.5px] flex items-center gap-1.5" style={{ color: C.danger }}><AlertTriangle size={11} />{error}</div>}
      </div>

      <div className="rounded-2xl overflow-hidden" style={{ background: C.surface, boxShadow: ELEV.card }}>
        <div className="px-5 py-3 text-[11px] font-black uppercase tracking-[0.16em]" style={{ color: C.textMute, borderBottom: `1px solid ${C.border}` }}>Usuarios</div>
        {users.map(u => (
          <div key={u.id} className="px-5 py-3 flex items-center gap-3" style={{ borderBottom: `1px solid ${C.border}` }}>
            <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold shrink-0" style={{ background: u.role === "admin" ? C.accentSoft : C.surface3, color: u.role === "admin" ? C.accent : C.textDim }}>
              {u.username[0].toUpperCase()}
            </div>
            <div className="flex-1 min-w-0">
              <div className="text-[13px] font-semibold" style={{ color: u.active ? C.text : C.textMute }}>{u.username}</div>
              <div className="text-[10.5px]" style={{ color: C.textMute }}>{u.role === "admin" ? "Administrador" : "Empleado"} · {u.active ? "Activo" : "Desactivado"}</div>
            </div>
            <Btn variant="ghost" onClick={() => toggle(u)} style={{ fontSize: 11 }}>
              {u.active ? "Desactivar" : "Activar"}
            </Btn>
            <Btn variant="ghost" onClick={() => del(u)} style={{ color: C.danger, fontSize: 11 }}>Eliminar</Btn>
          </div>
        ))}
        {users.length === 0 && <div className="px-5 py-4 text-[12px]" style={{ color: C.textMute }}>No hay usuarios aún.</div>}
      </div>
    </div>
  );
};

        .roster-cell:focus { background: ${C.surface3} !important; box-shadow: 0 0 0 2px ${C.accentGlow}; border-radius: 6px; }
        select.roster-cell { appearance: none; -webkit-appearance: none; cursor: pointer; }
        @keyframes fadeSlideIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes toastSlide { from { opacity: 0; transform: translateX(20px) translateY(8px); } to { opacity: 1; transform: translateX(0) translateY(0); } }
        @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .toast-enter { animation: toastIn 280ms cubic-bezier(.2,.8,.2,1) both; }
        .fade-in { animation: fadeSlideIn 280ms cubic-bezier(.2,.8,.2,1) both; }
        .card-hover { transition: transform 240ms cubic-bezier(.2,.8,.2,1), box-shadow 240ms cubic-bezier(.2,.8,.2,1); }
        .card-hover:hover { transform: translateY(-2px); }
        button { font-family: inherit; }
        /* Drag-and-drop visual states (preserved from v5) */
        .dnd-dragging { opacity: 0.35; transform: rotate(-1deg) scale(0.97); cursor: grabbing !important; }
        .dnd-droptarget { background: rgba(94,169,232,0.06) !important; outline: 2px dashed rgba(94,169,232,0.4); outline-offset: -8px; transition: all 180ms; }
        .dnd-card { cursor: grab; transition: transform 200ms cubic-bezier(.2,.8,.2,1), box-shadow 200ms ease; }
        .dnd-card:active { cursor: grabbing; }
        /* 3D Logo idle subtle wobble — only when not hovering */
        @keyframes logoIdle {
          0%, 100% { transform: rotateX(0deg) rotateY(0deg); }
          50% { transform: rotateX(-2deg) rotateY(3deg); }
        }
      `}</style>

      <Sidebar page={page} setPage={setPage} orders={orders} empresas={empresas} mobileOpen={sidebarMobile} onCloseMobile={() => setSidebarMobile(false)} />
      <ToastContainer />
      {showWelcome && <WelcomeModal onClose={() => setShowWelcome(false)} />}
      <CommandPalette
        open={commandOpen}
        onClose={() => setCommandOpen(false)}
        orders={orders} designs={designs} customers={customers} empresas={empresas}
        onOpenOrder={o => { setPendingOrderView(o.id); setPage("pedidos"); }}
        onOpenDesign={id => openDesign(id)}
        onSetPage={setPage}
      />

      <main className="flex-1 min-w-0 relative w-full" style={{ zIndex: 1 }}>
        <Topbar
          title={pageTitles[page].title}
          searchValue={searchQuery}
          onSearchChange={e => setSearchQuery(e.target.value)}
          searchRef={searchInputRef}
          searchPlaceholder={pageTitles[page].placeholder}
          onMenuClick={() => setSidebarMobile(true)}
          action={
            <div className="hidden md:flex items-center gap-1.5">
              <Btn variant="ghost" icon={Download} onClick={() => exportBackup({ orders, customers, designs, empresas })}>Exportar</Btn>
              <Btn variant="ghost" icon={Upload} onClick={() => document.getElementById("lp-restore-input")?.click()}>Importar</Btn>
              <input
                id="lp-restore-input"
                type="file"
                accept="application/json,.json"
                style={{ display: "none" }}
                onChange={(e) => { importBackup(e.target.files?.[0], { setOrders, setDesigns, setEmpresas }); e.target.value = ""; }}
              />
              <Btn variant="ghost" icon={Activity} onClick={() => { if (confirm("¿Restaurar datos de demo? Se sobrescribe todo lo actual.")) { setOrders(seedOrders); setDesigns(seedDesigns); setEmpresas(seedEmpresas); toast.ok("Datos de demo restaurados"); } }}>Demo</Btn>
            </div>
          }
        />
        <div className="fade-in" key={page}>
          {page === "inicio"   && <Dashboard orders={orders} designs={designs} customers={customers} onOpenOrder={o => { setPendingOrderView(o.id); setPage("pedidos"); }} onOpenDesign={id => openDesign(id)} onSetPage={setPage} />}
          {page === "pedidos"  && <Pedidos orders={orders} setOrders={setOrders} customers={customers} designs={designs} setDesigns={setDesigns} empresas={empresas} setEmpresas={setEmpresas} onViewDesign={openDesign} onOpenPlanilla={openPlanilla} pendingOrderView={pendingOrderView} clearPendingOrderView={() => setPendingOrderView(null)} searchQuery={searchQuery} />}
          {page === "planillas"  && <Planillas orders={orders} setOrders={setOrders} empresas={empresas} pendingPlanillaOrderId={pendingPlanillaOrderId} clearPendingPlanillaOrderId={() => setPendingPlanillaOrderId(null)} searchQuery={searchQuery} />}
          {page === "diseno"   && <Disenos designs={designs} setDesigns={setDesigns} customers={customers} orders={orders} pendingDesignView={pendingDesignView} clearPendingDesignView={() => setPendingDesignView(null)} searchQuery={searchQuery} />}
          {page === "entregas" && <Entregas orders={orders} searchQuery={searchQuery} />}
          {page === "usuarios" && <UsuariosAdmin />}
        </div>
      </main>
    </div>
  );
}

import { createRoot } from "react-dom/client";
const loadEl = document.getElementById("lp-loading");
if (loadEl) loadEl.remove();
createRoot(document.getElementById("root")).render(<BerastoreSystem />);
  </script>
</body>
</html>

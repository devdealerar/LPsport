      const matches = [...work.matchAll(/\b(XXXL|XXL|XL|XXS|XS|L|M|S)\b/g)];

    return [...rows, newRow({ nombre, camiseta, short, talle })];

};

// module load so any subsequent usePersistedState read gets the migrated value.
const V10_MIGRATION_MARKER = "lpsport:migrated-to-v10";
const V11_FEATURES_MARKER = "lpsport:v11-features-init";
(function migrateV9ToV10() {
  try {
    if (typeof localStorage === "undefined") return;
    if (localStorage.getItem(V10_MIGRATION_MARKER)) return;
    const pairs = [
      ["lpsport:orders:v9", "lpsport:orders:v10"],
      ["lpsport:customers:v9", "lpsport:customers:v10"],
      ["lpsport:designs:v9", "lpsport:designs:v10"],
      ["lpsport:empresas:v9", "lpsport:empresas:v10"],
    ];
    let copied = 0;
    for (const [v9k, v10k] of pairs) {
      if (localStorage.getItem(v10k)) continue; // v10 already has data
      const v9val = localStorage.getItem(v9k);
      if (v9val) { localStorage.setItem(v10k, v9val); copied++; }
    }
    localStorage.setItem(V10_MIGRATION_MARKER, new Date().toISOString());
    if (copied) console.log(`[lp-sport] Migrated ${copied} keys from v9 → v10`);
  } catch {}
})();

// ── v10: image compression helper ─────────────────────────────────
// Phone photos can be 5MB+ which bloats localStorage and the server JSON store.
// We downsample images on upload: max 2000px on long side, JPEG quality 0.85,
// strip metadata. Returns a new File-shaped object with the compressed dataUrl.
// Pass-through for non-images and tiny images.
const compressImage = async (fileLike) => {
  if (!fileLike?.type?.startsWith("image/") || !fileLike?.dataUrl) return fileLike;
  // Skip PNG/SVG transparency-sensitive formats > don't reencode as JPEG
  // Also skip already-small images
  if (fileLike.size && fileLike.size < 300_000) return fileLike;

  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try {
        const MAX = 2000;
        const scale = Math.min(MAX / img.width, MAX / img.height, 1);
        const W = Math.round(img.width * scale);
        const H = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext("2d");
        // Fill with white so transparent PNGs don't go to black when reencoded as JPEG
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, W, H);
        ctx.drawImage(img, 0, 0, W, H);
        const isPng = fileLike.type === "image/png";
        // Keep PNG if transparency might matter (small logos); JPEG everything else for size
        const outType = isPng && fileLike.size < 1_000_000 ? "image/png" : "image/jpeg";
        const dataUrl = canvas.toDataURL(outType, 0.85);
        const newSize = Math.round((dataUrl.length - dataUrl.indexOf(",") - 1) * 0.75);
        // Only return compressed version if it's actually smaller
        if (newSize < (fileLike.size || Infinity)) {
          resolve({
            ...fileLike,
            type: outType,
            size: newSize,
            dataUrl,
            originalSize: fileLike.size,
            compressed: true
          });
        } else {
          resolve(fileLike);
        }
      } catch { resolve(fileLike); }
    };
    img.onerror = () => resolve(fileLike);
    img.src = fileLike.dataUrl;
  });
};

  try {
    await fetch("/api/activity", {

      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, message, orderId: extra.orderId || null, meta: extra.meta || null })

  } catch {}
};

    (async () => {
      try {
        const r = await fetch(`/api/activity?limit=${limit}`, { credentials: "include" });
        if (r.ok && !cancelled) {
          const d = await r.json();
          setEntries(d.entries || []);
        }
      } catch {}
    })();
    return () => { cancelled = true; };
  }, [mode, limit, refreshKey]);
  return entries;
};

// ── v10: relative time formatter ─────────────────────────────────
const fmtRelative = (iso) => {
  if (!iso) return "";
  const t = new Date(iso).getTime();
  const diff = Date.now() - t;
  if (diff < 0) return "ahora";
  const s = Math.floor(diff / 1000);
  if (s < 60) return "hace " + s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return "hace " + m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return "hace " + h + " h";
  const d = Math.floor(h / 24);
  if (d < 7) return "hace " + d + " días";
  return new Date(iso).toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
};

// ── v11: PWA install prompt capture ──────────────────────────────
// Browsers fire `beforeinstallprompt` ONCE when the PWA becomes installable.
// We have to call e.preventDefault() to defer, then keep the event around so the
// user can trigger install via a button later. We also detect if already installed.
let __pwaInstallEvent = null;
const __pwaListeners = new Set();
if (typeof window !== "undefined") {
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    __pwaInstallEvent = e;
    __pwaListeners.forEach(fn => { try { fn(); } catch {} });
  });
  window.addEventListener("appinstalled", () => {
    __pwaInstallEvent = null;
    __pwaListeners.forEach(fn => { try { fn(); } catch {} });
  });
}
const useInstallPrompt = () => {
  const [, force] = useState(0);
  useEffect(() => {
    const fn = () => force(x => x + 1);
    __pwaListeners.add(fn);
    return () => __pwaListeners.delete(fn);
  }, []);
  const isStandalone = typeof window !== "undefined" && (window.matchMedia?.("(display-mode: standalone)").matches || window.navigator?.standalone);
  return {
    canInstall: !!__pwaInstallEvent && !isStandalone,
    isInstalled: isStandalone,
    install: async () => {
      if (!__pwaInstallEvent) return { outcome: "unavailable" };
      __pwaInstallEvent.prompt();
      const choice = await __pwaInstallEvent.userChoice;
      if (choice.outcome === "accepted") __pwaInstallEvent = null;
      return choice;
    }
  };
};

// ── v11: register service worker on page load ────────────────────
if (typeof window !== "undefined" && "serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}

// Replacement for usePersistedState: works both online (API) and offline (localStorage cache).
function usePersistedState(key, initial) {
  const [state, setState] = useState(initial);
  const loaded = useRef(false);
  const lastSaved = useRef(null);
  const mode = useStorageMode();

  // Initial load: try localStorage cache first (instant), then refresh from API if online
  useEffect(() => {
    let cancelled = false;
    (async () => {
      // Try local cache for instant paint
      try {
        if (typeof localStorage !== "undefined") {
          const cached = localStorage.getItem(key);
          if (cached && !cancelled) setState(JSON.parse(cached));
        }
      } catch {}

      // Try the API if reachable
      if (mode === "api") {
        try {
          const r = await fetch(`/api/data/${encodeURIComponent(key)}`, { credentials: "include" });
          if (r.ok && !cancelled) {
            const d = await r.json();
            if (d?.value) {
              const remote = JSON.parse(d.value);
              setState(remote);
              try { localStorage.setItem(key, d.value); } catch {}
            }
          }
        } catch {}
      }
      loaded.current = true;
    })();
    return () => { cancelled = true; };
  }, [key, mode]);

  // Save: always to localStorage, and to API if available
  useEffect(() => {
    if (!loaded.current) return;
    const value = JSON.stringify(state);
    if (value === lastSaved.current) return;
    lastSaved.current = value;
    try { if (typeof localStorage !== "undefined") localStorage.setItem(key, value); } catch {}
    if (mode === "api") {
      fetch(`/api/data/${encodeURIComponent(key)}`, {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value })
      }).then(r => {
        if (r.status === 401) setStorageMode("login");
      }).catch(() => {
        // Network glitch — keep in local cache, retry next change
      });
    }
  }, [key, state, mode]);

  return [state, setState];
}

    orders,

const importBackup = (file, { setOrders, setDesigns, setEmpresas }) => {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.__format !== "lp-sport-backup") {
        toast.err("Archivo inválido — no es un backup de LP Sport");
        return;
      }
      if (!confirm(`¿Restaurar backup del ${data.exportedAt?.split("T")[0]}? Se reemplazarán todos los datos actuales.`)) return;
      if (Array.isArray(data.orders)) setOrders(data.orders);
      if (Array.isArray(data.designs)) setDesigns(data.designs);
      if (Array.isArray(data.empresas)) setEmpresas(data.empresas);
      toast.ok(`Restaurado · ${data.orders?.length || 0} pedidos, ${data.empresas?.length || 0} empresas, ${data.designs?.length || 0} diseños`);
    } catch (err) {
      toast.err("Error leyendo el backup: " + err.message);
    }
  };
  reader.readAsText(file);
};

// Extract a dominant-color palette from an image dataURL.
// Pure JS: downsample to 100×100 on canvas, bucket pixels into 4-bit-per-channel bins,
// pick top distinct colors. Returns hex array (up to `count`). Resolves [] on any failure.
const extractPalette = (dataUrl, count = 4) => new Promise((resolve) => {
  if (!dataUrl || typeof dataUrl !== "string" || !dataUrl.startsWith("data:image")) { resolve([]); return; }
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => {
    try {
      const maxSize = 100;
      const scale = Math.min(maxSize / img.width, maxSize / img.height, 1);
      const W = Math.max(1, Math.floor(img.width * scale));
      const H = Math.max(1, Math.floor(img.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = W; canvas.height = H;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, W, H);
      const pixels = ctx.getImageData(0, 0, W, H).data;
      const buckets = new Map();
      for (let i = 0; i < pixels.length; i += 4) {
        if (pixels[i + 3] < 200) continue;
        const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
        const key = ((r >> 4) << 8) | ((g >> 4) << 4) | (b >> 4);
        const cur = buckets.get(key);
        if (cur) { cur[0] += r; cur[1] += g; cur[2] += b; cur[3]++; }
        else buckets.set(key, [r, g, b, 1]);
      }
      const sorted = [...buckets.values()].sort((a, b) => b[3] - a[3]);
      const result = [];
      const isSimilar = (r, g, b) => result.some(([R, G, B]) => Math.abs(R - r) + Math.abs(G - g) + Math.abs(B - b) < 70);
      for (const [r, g, b, n] of sorted) {
        const avgR = Math.round(r / n), avgG = Math.round(g / n), avgB = Math.round(b / n);
        if (isSimilar(avgR, avgG, avgB)) continue;
        result.push([avgR, avgG, avgB]);
        if (result.length >= count) break;
      }
      resolve(result.map(([r, g, b]) => "#" + [r, g, b].map(n => n.toString(16).padStart(2, "0")).join("")));
    } catch { resolve([]); }
  };
  img.onerror = () => resolve([]);
  img.src = dataUrl;
});


// Result: a single .html that opens offline and already contains their pedidos/empresas/diseños.
const downloadSelf = () => {
  try {
    // Snapshot all v7 keys from localStorage (only this app's data)
    const dataSeed = {};
    const v7Prefix = "lpsport:";
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(v7Prefix)) dataSeed[k] = localStorage.getItem(k);
    }
    // Build a seed <script> that re-populates localStorage when the downloaded HTML opens
    const seedScript = `<script>(function(){try{var d=${JSON.stringify(dataSeed)};for(var k in d){localStorage.setItem(k,d[k]);}}catch(e){}})();<\/script>`;
    // Grab the current page's HTML and inject the seed before the storage polyfill
    let html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
    // The polyfill block is anchored by a unique comment
    const anchor = "<!-- Storage polyfill";
    if (html.includes(anchor)) {
      html = html.replace(anchor, seedScript + "\n  " + anchor);
    }
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "lp-sport.html";
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    toast.ok("App descargada · Doble click para abrir desde tu escritorio");
  } catch (err) {
    toast.err("No se pudo descargar: " + err.message);
  }
};

// ── Tilt3D: subtle 3D card tilt following mouse position (premium feel, max 6° rotation) ──
const Tilt3D = ({ children, className = "", style = {}, intensity = 8, onClick, scale = 1.012, glowColor = "rgba(94,169,232,0.12)" }) => {
  const ref = useRef(null);
  const onMove = (e) => {
    if (!ref.current) return;
    const rect = ref.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    const rx = (py - 0.5) * -intensity;
    const ry = (px - 0.5) * intensity;
    ref.current.style.transform = `perspective(1100px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${scale})`;
    // Parallax glow follows mouse — light theme uses blue tint
    const glow = ref.current.querySelector("[data-tilt-glow]");
    if (glow) {
      glow.style.background = `radial-gradient(480px circle at ${px * 100}% ${py * 100}%, ${glowColor}, transparent 55%)`;
      glow.style.opacity = "1";
    }
    // Slight inner shine on the top edge (specular highlight)
    const shine = ref.current.querySelector("[data-tilt-shine]");
    if (shine) {
      shine.style.opacity = String(0.6 - py * 0.5);
    }
  };
  const onLeave = () => {
    if (!ref.current) return;
    ref.current.style.transform = "perspective(1100px) rotateX(0deg) rotateY(0deg) scale(1)";
    const glow = ref.current.querySelector("[data-tilt-glow]");
    if (glow) glow.style.opacity = "0";
    const shine = ref.current.querySelector("[data-tilt-shine]");
    if (shine) shine.style.opacity = "0";
  };
  return (
    <div
      ref={ref}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      onClick={onClick}
      className={"relative " + className}
      style={{
        transformStyle: "preserve-3d",
        transition: "transform 420ms cubic-bezier(.2,.8,.2,1)",
        willChange: "transform",
        ...style
      }}
    >
      {children}
      <div data-tilt-shine className="absolute inset-x-0 top-0 h-1/2 pointer-events-none rounded-t-2xl" style={{ opacity: 0, transition: "opacity 280ms ease", background: "linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 100%)" }} />
      <div data-tilt-glow className="absolute inset-0 rounded-2xl pointer-events-none" style={{ opacity: 0, transition: "opacity 280ms ease" }} />
    </div>
  );
};

// ── LP brand logo (SVG path recreation of reference) ─────────
// v9.4 fresh redesign. Thin stems, dominant right-pointing bowl, dramatic dagger spike on
// the L foot, triangular cut inside the P top piece. Built for 7-layer Z-stack extrusion.
// All cuts straight — no curves. ViewBox 0 0 100 100.
const LP_GLYPH_PATHS = {
  // L: vertical stem (5 wide) + horizontal foot with sharp dagger spike at right end
  // pointing down-right. Single continuous polygon.
  L: "M 2 2 L 7 2 L 7 80 L 30 80 L 55 98 L 2 98 Z",

  // P main: stem + top piece combined. Top edge extends from x=22 to x=95, then slants
  // down-left to (78, 26) — bottom-right corner of top piece — then back to stem.
  P_main: "M 22 2 L 95 2 L 78 26 L 28 26 L 28 98 L 22 98 Z",

  // P inner cut: triangular hole inside the top piece, apex pointing down.
  // Combined with P_main via fillRule="evenodd" to subtract.
  P_top_cut: "M 40 8 L 76 8 L 60 24 Z",

  // P bowl: large right-pointing triangle attached to right side of stem.
  // Apex sticks out far right at mid-height — the dominant visual element.
  P_bowl: "M 28 30 L 98 54 L 28 76 Z",
};

const LPGlyph = ({ fill }) => (
  <g fill={fill}>
    <path d={LP_GLYPH_PATHS.L} />
    <path d={`${LP_GLYPH_PATHS.P_main} ${LP_GLYPH_PATHS.P_top_cut}`} fillRule="evenodd" />
    <path d={LP_GLYPH_PATHS.P_bowl} />
  </g>
);

const LP3DLogo = ({ size = 44 }) => {
  const wrapRef = useRef(null);
  const innerRef = useRef(null);
  const [spinning, setSpinning] = useState(false);

  const onMove = (e) => {
    if (spinning || !wrapRef.current || !innerRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    const px = (e.clientX - rect.left) / rect.width;
    const py = (e.clientY - rect.top) / rect.height;
    const rx = (py - 0.5) * -32;
    const ry = (px - 0.5) * 36;
    innerRef.current.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
    const shadow = wrapRef.current.querySelector("[data-logo-shadow]");
    if (shadow) {
      shadow.style.transform = `translate(${(px - 0.5) * -6}px, ${(py - 0.5) * -3 + 4}px) scaleX(${1 - Math.abs(ry) * 0.005})`;
      shadow.style.opacity = "0.55";
    }
  };

  const onLeave = () => {
    if (spinning || !innerRef.current) return;
    innerRef.current.style.transform = "rotateX(0deg) rotateY(0deg)";
    const shadow = wrapRef.current?.querySelector("[data-logo-shadow]");
    if (shadow) {
      shadow.style.transform = "translate(0, 4px) scaleX(1)";
      shadow.style.opacity = "0.35";
    }
  };

  const onClick = () => {
    if (spinning || !innerRef.current) return;
    setSpinning(true);
    innerRef.current.style.transition = "transform 720ms cubic-bezier(.4,.0,.2,1)";
    innerRef.current.style.transform = "rotateX(0deg) rotateY(360deg)";
    setTimeout(() => {
      if (!innerRef.current) return;
      innerRef.current.style.transition = "none";
      innerRef.current.style.transform = "rotateX(0deg) rotateY(0deg)";
      void innerRef.current.offsetHeight;
      innerRef.current.style.transition = "transform 280ms cubic-bezier(.2,.8,.2,1)";
      setSpinning(false);
    }, 720);
  };

  // 7 Z-stacked layers for real 3D extrusion (back darkest → front pure white)
  const layers = 7;
  return (
    <div
      ref={wrapRef}
      onMouseMove={onMove}
      onMouseLeave={onLeave}
      onClick={onClick}
      style={{
        width: size,
        height: size,
        perspective: 520,
        cursor: "pointer",
        flexShrink: 0,
        position: "relative"
      }}
    >
      <div data-logo-shadow style={{
        position: "absolute",
        left: "10%",
        right: "10%",
        bottom: -4,
        height: 8,
        borderRadius: "50%",
        background: "radial-gradient(ellipse, rgba(94,169,232,0.40) 0%, transparent 70%)",
        filter: "blur(4px)",
        opacity: 0.35,
        transform: "translate(0, 4px)",
        transition: "opacity 240ms ease, transform 280ms cubic-bezier(.2,.8,.2,1)",
        pointerEvents: "none"
      }} />

      <div
        ref={innerRef}
        style={{
          width: "100%",
          height: "100%",
          position: "relative",
          transformStyle: "preserve-3d",
          transition: "transform 280ms cubic-bezier(.2,.8,.2,1)",
          willChange: "transform"
        }}
      >
        {Array.from({ length: layers }, (_, i) => {
          const isFront = i === layers - 1;
          const depth = (i - (layers - 1)) * 1.8;
          let fill;
          if (isFront) {
            fill = "#ffffff";
          } else {
            const t = i / (layers - 1);
            const gray = Math.round(35 + t * 200);
            fill = `rgb(${gray},${gray},${gray + 5})`;
          }
          return (
            <svg
              key={i}
              viewBox="0 0 100 100"
              xmlns="http://www.w3.org/2000/svg"
              style={{
                position: "absolute",
                inset: 0,
                transform: `translateZ(${depth}px)`,
                width: "100%",
                height: "100%",
                pointerEvents: "none"
              }}
            >
              <LPGlyph fill={fill} />
            </svg>
          );
        })}

// ── File upload ──────────────────────────────────────────────────
const MAX_FILE_BYTES = 50 * 1024 * 1024;
const fmtBytes = (b) => b < 1024 ? `${b}B` : b < 1048576 ? `${(b / 1024).toFixed(0)}KB` : `${(b / 1048576).toFixed(1)}MB`;

const ArchivoUpload = ({ archivo, onChange }) => {
  const inputRef = useRef(null);
  const [drag, setDrag] = useState(false);
  const handleFile = (f) => {
    if (!f) return;
    if (f.size > MAX_FILE_BYTES) { toast.err(`Archivo demasiado grande (${fmtBytes(f.size)}). Máx: 50MB`); return; }
    const reader = new FileReader();
    reader.onload = e => onChange({ name: f.name, size: f.size, type: f.type || "application/octet-stream", dataUrl: e.target.result, uploadedAt: new Date().toISOString() });
    reader.readAsDataURL(f);
  };
  if (archivo) {
    const isImg = archivo.type?.startsWith("image/");
    return (
      <div className="flex items-center gap-3 p-3 rounded-xl" style={{ background: C.surface2, border: `1px solid ${C.border}` }}>
        {isImg && archivo.dataUrl
          ? <img src={archivo.dataUrl} alt="" className="w-12 h-12 rounded-lg object-cover shrink-0 border" style={{ borderColor: C.border }} />
          : <div className="w-12 h-12 rounded-lg flex items-center justify-center shrink-0" style={{ background: C.surface3, color: C.accent }}><FileText size={20} /></div>
        }
        <div className="flex-1 min-w-0">
          <div className="text-[12.5px] font-semibold truncate" style={{ color: C.text }}>{archivo.name}</div>
          <div className="text-[10.5px]" style={{ color: C.textMute, fontFamily: "'JetBrains Mono', monospace" }}>{fmtBytes(archivo.size)} · {archivo.type.split("/")[1]?.toUpperCase()}</div>
        </div>
        <button onClick={() => onChange(null)} className="w-7 h-7 flex items-center justify-center rounded-lg transition-all hover:bg-red-500/10" style={{ color: C.textMute }}><X size={13} /></button>
      </div>
    );
  }
  return (
    <>
      <div onClick={() => inputRef.current?.click()} onDragOver={e => { e.preventDefault(); setDrag(true); }} onDragLeave={() => setDrag(false)}
        onDrop={e => { e.preventDefault(); setDrag(false); handleFile(e.dataTransfer.files[0]); }}
        className="rounded-xl p-5 text-center cursor-pointer transition-all duration-150"
        style={{ background: drag ? C.accentGlow : C.surface2, border: `1.5px dashed ${drag ? C.accent : C.border}` }}
      >
        <UploadCloud size={20} className="mx-auto mb-2" style={{ color: drag ? C.accent : C.textMute }} />
        <div className="text-[12.5px] font-medium" style={{ color: C.text }}>Arrastrá o tocá para adjuntar</div>
        <div className="text-[10.5px] mt-0.5" style={{ color: C.textMute }}>PNG · JPG · PDF · SVG · AI · PSD · hasta 50MB</div>
      </div>
      <input ref={inputRef} type="file" hidden accept="image/*,.pdf,.svg,.ai,.psd,.cdr,.eps" onChange={e => handleFile(e.target.files[0])} />
    </>
  );
};

// ── DownloadAppButton: prominent, animated, persistent state ───────
// Shows three visual states: idle (gradient CTA), downloading (spinner inside icon), done (checkmark + "Ya descargado").
// After a successful download we track it in localStorage so subsequent loads remember and show the success state until the user clicks again.
const DOWNLOAD_KEY = "lpsport:app-downloaded-at";
const DownloadAppButton = () => {
  const { canInstall, isInstalled, install } = useInstallPrompt();
  const [phase, setPhase] = useState(() => {
    try { return localStorage.getItem(DOWNLOAD_KEY) ? "done" : "idle"; } catch { return "idle"; }
  });
  const [lastDownloadDate, setLastDownloadDate] = useState(() => {
    try { return localStorage.getItem(DOWNLOAD_KEY); } catch { return null; }
  });

  // v11: if the PWA install prompt is available, button installs natively (desktop
  // shortcut + mobile app icon). Otherwise falls back to HTML download.
  // If already installed (running standalone), shows "App instalada" disabled.
  const mode = isInstalled ? "installed" : canInstall ? "install" : "download";

  const handle = async () => {
    if (phase === "downloading") return;
    if (mode === "install") {
      try {
        await install();
      } catch {}
      return;
    }
    if (mode === "installed") return;
    setPhase("downloading");
    await new Promise(r => setTimeout(r, 350));
    try {
      downloadSelf();
      const now = new Date().toISOString();
      try { localStorage.setItem(DOWNLOAD_KEY, now); } catch {}
      setLastDownloadDate(now);
      setPhase("done");
    } catch {
      setPhase("idle");
    }
  };
  const dateStr = lastDownloadDate ? new Date(lastDownloadDate).toLocaleDateString("es-AR", { day: "2-digit", month: "short" }) : null;

  const isIdle = phase === "idle", isDoing = phase === "downloading", isDone = phase === "done";
  const isInstall = mode === "install";
  const isInstalledMode = mode === "installed";

  // Color theme by mode
  const themeColor = isInstall ? C.accent : isInstalledMode ? C.ok : isDone ? C.ok : C.accent;
  const bg = isInstall
    ? `linear-gradient(135deg, ${C.accent}33 0%, ${C.accent}14 100%)`
    : isInstalledMode
      ? `linear-gradient(135deg, ${C.ok}26 0%, ${C.ok}12 100%)`
      : isDone
        ? `linear-gradient(135deg, ${C.ok}26 0%, ${C.ok}12 100%)`
        : isDoing
          ? `linear-gradient(135deg, ${C.accent}40 0%, ${C.accent}18 100%)`
          : `linear-gradient(135deg, ${C.accent}22 0%, ${C.accent}0d 100%)`;

  const title = isInstall ? "Instalar app" : isInstalledMode ? "App instalada" : isDoing ? "Descargando…" : isDone ? "Ya descargado" : "Descargar app";
  const subtitle = isInstall
    ? "Acceso directo en escritorio"
    : isInstalledMode
      ? "Corriendo en modo app"
      : isDoing
        ? "Empaquetando archivo"
        : isDone
          ? `${dateStr} · re-bajar`
          : "Funciona offline · 160 KB";

  const TitleIcon = isInstall ? Download : isInstalledMode ? CheckCircle2 : isDoing ? null : isDone ? CheckCircle2 : Download;

  return (
    <button
      onClick={handle}
      disabled={isDoing || isInstalledMode}
      className="mx-3 my-3 px-3 py-3 rounded-xl flex items-center gap-3 transition-all relative overflow-hidden group"
      style={{
        background: bg,
        boxShadow: `inset 0 0 0 1px ${themeColor}33, ${ELEV.highlight}`,
        cursor: isDoing ? "wait" : isInstalledMode ? "default" : "pointer"
      }}
      onMouseEnter={e => { if (!isDoing && !isInstalledMode) e.currentTarget.style.boxShadow = `inset 0 0 0 1px ${themeColor}66, 0 6px 24px ${themeColor}1a`; }}
      onMouseLeave={e => { e.currentTarget.style.boxShadow = `inset 0 0 0 1px ${themeColor}33, ${ELEV.highlight}`; }}
      title={isInstall ? "Instalar como app nativa con ícono en el escritorio" : isInstalledMode ? "Ya está instalada" : "Descargar versión offline (HTML)"}
    >
      <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0 relative" style={{
        background: `${themeColor}22`,
        boxShadow: `inset 0 0 0 1px ${themeColor}44`
      }}>
        {isDoing ? (
          <div className="w-4 h-4 rounded-full" style={{
            border: `2px solid ${C.accent}33`,
            borderTopColor: C.accent,
            animation: "lp-spin 0.8s linear infinite"
          }} />
        ) : TitleIcon ? (
          <TitleIcon size={15} strokeWidth={2.4} style={{ color: themeColor, transition: "transform 240ms cubic-bezier(.2,.8,.2,1)" }} className={isInstall || (!isInstalledMode && !isDone) ? "group-hover:translate-y-0.5" : ""} />
        ) : null}
      </div>

      <div className="flex-1 text-left min-w-0">
        <div className="text-[12px] font-bold leading-tight" style={{ color: themeColor === C.accent ? C.text : themeColor, fontFamily: "'D-DIN Expanded', 'Barlow', sans-serif" }}>
          {title}
        </div>
        <div className="text-[9.5px] mt-0.5 leading-tight" style={{ color: C.textMute, fontFamily: "'JetBrains Mono', monospace" }}>
          {subtitle}
        </div>
      </div>

      {!isDoing && !isInstalledMode && (
        <ChevronRight size={13} className="shrink-0 opacity-30 group-hover:opacity-100 transition-opacity" style={{ color: themeColor }} />
      )}
    </button>
  );
};

// ── Modal / Drawer ────────────────────────────────────────────────
// ── Toasts: minimal feedback for actions (no context, ref-based singleton) ──
let toastIdCounter = 0;
const toastListeners = new Set();
const toast = (message, opts = {}) => {
  const t = { id: ++toastIdCounter, message, kind: opts.kind || "info", duration: opts.duration || 2600 };
  toastListeners.forEach(fn => fn({ type: "add", toast: t }));
  return t.id;
};
toast.ok = (msg) => toast(msg, { kind: "ok" });
toast.warn = (msg) => toast(msg, { kind: "warn" });
toast.err = (msg) => toast(msg, { kind: "err" });

const ToastContainer = () => {
  const [items, setItems] = useState([]);
  useEffect(() => {
    const fn = (ev) => {
      if (ev.type === "add") {
        setItems(prev => [...prev, ev.toast]);
        setTimeout(() => setItems(prev => prev.filter(i => i.id !== ev.toast.id)), ev.toast.duration);
      }
    };
    toastListeners.add(fn);
    return () => toastListeners.delete(fn);
  }, []);

  const colorFor = (k) => k === "ok" ? C.ok : k === "warn" ? C.warn : k === "err" ? C.danger : C.accent;
  const iconFor = (k) => k === "ok" ? CheckCircle2 : k === "warn" ? AlertTriangle : k === "err" ? X : Sparkles;

  return (
    <div className="fixed bottom-6 right-6 z-[80] flex flex-col gap-2 pointer-events-none">
      {items.map(t => {
        const IconC = iconFor(t.kind);
        const c = colorFor(t.kind);
        return (
          <div key={t.id} className="toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl min-w-[260px] max-w-[420px]"
            style={{
              background: "linear-gradient(180deg, " + C.surface + " 0%, " + C.bgSoft + " 100%)",
              boxShadow: ELEV.floating + ", 0 0 0 1px " + c + "33",
              backdropFilter: "blur(20px)"
            }}>
            <div className="w-7 h-7 rounded-lg flex items-center justify-center shrink-0" style={{ background: c + "22", color: c }}>
              <IconC size={14} strokeWidth={2.4} />
            </div>
            <div className="text-[12.5px] font-medium flex-1" style={{ color: C.text, fontFamily: "'D-DIN Expanded', 'Barlow', sans-serif" }}>{t.message}</div>
          </div>
        );
      })}
    </div>
  );
};

        {/* Sticky header — always visible, contains close button */}
        <div className="flex items-center justify-between px-6 py-4 shrink-0" style={{ borderBottom: `1px solid ${C.border}` }}>
          <h2 className="text-[15px] font-bold truncate pr-2" style={{ color: C.text, fontFamily: "'D-DIN Expanded', 'Barlow', sans-serif", letterSpacing: "-0.01em" }}>{title}</h2>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-lg transition-all hover:bg-white/5 shrink-0"><X size={16} style={{ color: C.textDim }} /></button>
        </div>
        {/* Scrollable body */}
        <div ref={bodyRef} className="overflow-y-auto px-6 py-5 space-y-5" style={{ minHeight: 0 }}>
          {children}
        </div>
      </div>
    </div>
  );
};

const Drawer = ({ onClose, children }) => {
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => { document.body.style.overflow = prev; };

  return (
    <div className="fixed inset-0 z-50 flex justify-end" style={{ background: "rgba(0,0,0,0.55)", backdropFilter: "blur(8px)", WebkitBackdropFilter: "blur(8px)" }} onClick={onClose}>
      <div onClick={e => e.stopPropagation()} className="h-full overflow-y-auto p-6 w-full max-w-[500px] space-y-5" style={{
        background: "linear-gradient(180deg, " + C.surface + " 0%, " + C.bgSoft + " 100%)",

};

// ── LoginScreen: shown when backend reports 401 ──────────────────
const LoginScreen = ({ onLoggedIn }) => {
  const [username, setUsername] = useState("");
  const [password, setPassword] = useState("");
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const usernameRef = useRef(null);

  useEffect(() => { usernameRef.current?.focus(); }, []);

  const submit = async (e) => {
    e?.preventDefault();
    if (submitting) return;
    setSubmitting(true); setError("");
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: username.trim(), password })
      });
      if (r.ok) {
        const d = await r.json().catch(() => ({}));
        setCurrentUser({ role: d.role, username: d.username });
        onLoggedIn?.();
      } else {
        const d = await r.json().catch(() => ({}));
        setError(d.error || "Usuario o contraseña incorrectos");
      }
    } catch (err) {
      setError("Error de red — verificá la conexión");
    } finally {
      setSubmitting(false);
    }
  };

  const inputStyle = (hasError) => ({
    background: C.surface2,
    color: C.text,
    border: `1px solid ${hasError ? C.danger + "55" : C.border}`,
    fontFamily: "'JetBrains Mono', monospace",
    ...PREMIUM_FONT
  });

  return (
    <div className="fixed inset-0 z-[90] flex items-center justify-center p-4" style={{
      background: C.bg,
      backgroundImage: `radial-gradient(circle at 30% 20%, rgba(94,169,232,0.10) 0%, transparent 50%), radial-gradient(circle at 70% 80%, rgba(94,169,232,0.06) 0%, transparent 50%)`,
      ...PREMIUM_FONT
    }}>
      <form onSubmit={submit} className="w-full max-w-sm">
        <div className="text-center mb-7">
          <div className="flex justify-center mb-5"><LP3DLogo size={72} /></div>
          <div className="text-[20px] font-bold tracking-[0.04em]" style={{ color: C.text, fontFamily: "'D-DIN Expanded', 'Barlow Condensed', sans-serif" }}>LP SPORT</div>
          <div className="text-[10.5px] mt-1 tracking-[0.18em] lowercase" style={{ color: C.textDim }}>futbol design</div>
        </div>

        <div className="rounded-2xl p-6 space-y-4" style={{
          background: "linear-gradient(180deg, " + C.surface + " 0%, " + C.bgSoft + " 100%)",
          boxShadow: ELEV.floating
        }}>
          <div>
            <div className="text-[10.5px] font-black uppercase tracking-[0.18em] mb-2" style={{ color: C.textMute }}>Usuario</div>
            <input
              ref={usernameRef}
              type="text"
              value={username}
              onChange={e => { setUsername(e.target.value); setError(""); }}
              placeholder="Ingresá tu usuario"
              className="w-full px-4 py-3 rounded-xl text-[14px] outline-none"
              style={inputStyle(!!error)}
              autoComplete="username"
            />
          </div>
          <div>
            <div className="text-[10.5px] font-black uppercase tracking-[0.18em] mb-2" style={{ color: C.textMute }}>Contraseña</div>
            <input
              type="password"
              value={password}
              onChange={e => { setPassword(e.target.value); setError(""); }}
              placeholder="Ingresá tu clave"
              className="w-full px-4 py-3 rounded-xl text-[14px] outline-none"
              style={inputStyle(!!error)}
              autoComplete="current-password"
            />
            {error && <div className="text-[11.5px] mt-2 flex items-center gap-1.5" style={{ color: C.danger }}><AlertTriangle size={11} />{error}</div>}
          </div>

          <Btn variant="primary" onClick={submit} disabled={submitting || !username || !password} className="w-full justify-center">
            {submitting ? "Entrando…" : "Entrar"}
          </Btn>
        </div>

        <div className="text-center mt-5 text-[10.5px]" style={{ color: C.textMute }}>
          Sesión protegida · Tus datos se sincronizan entre tus dispositivos
        </div>
      </form>
    </div>
  );
};
